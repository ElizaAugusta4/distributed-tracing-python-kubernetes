apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ .Release.Namespace }}
data:
  promtail.yaml: |
    # Config do Promtail gerada via Helm.
    # Este arquivo é montado no Pod em /etc/promtail/promtail.yaml.
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    {{- if .Values.config.positions }}
    # positions: onde o Promtail salva o "offset" do que já foi lido.
    positions:
{{ toYaml .Values.config.positions | nindent 6 }}
    {{- else }}
    positions:
      filename: /tmp/positions.yaml
    {{- end }}
    {{- if .Values.config.clients }}
    # clients: para onde o Promtail envia logs (Loki /push).
    clients:
{{ toYaml .Values.config.clients | nindent 6 }}
    {{- else if .Values.config.lokiAddress }}
    clients:
      - url: {{ .Values.config.lokiAddress | quote }}
    {{- else }}
    clients: []
    {{- end }}
    {{- if and .Values.config.snippets .Values.config.snippets.scrapeConfigs }}
    # scrape_configs: jobs de coleta (Kubernetes SD, paths, relabel, pipeline stages etc.).
    scrape_configs:
{{ .Values.config.snippets.scrapeConfigs | nindent 6 }}
    {{- else }}
    scrape_configs: []
    {{- end }}
