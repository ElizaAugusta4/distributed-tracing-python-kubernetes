grafana:
  podLabels:
    gitops-demo: "true"
  dashboardsProvider:
    enabled: true

  sidecar:
    dashboards:
      enabled: true


  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      isDefault: false

    - name: Tempo
      type: tempo
      url: http://tempo:3200
      access: proxy
      isDefault: false

prometheus:
  prometheusSpec:
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack

    ruleNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
