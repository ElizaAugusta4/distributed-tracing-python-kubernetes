apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    app: order
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: order
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
