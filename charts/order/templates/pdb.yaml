{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order
  namespace: {{ .Release.Namespace }}
  labels:
    app: order
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: order
{{- end }}
