image:
  repository: ghcr.io/elizaaugusta4/distributed-tracing-python-kubernetes/order
  tag: 5f81b3d585f4e1404dc3fe91cdec01e44b289e31
  pullPolicy: IfNotPresent
database:
  enabled: true
  host: postgres
  port: 5432
  secretName: postgres-auth
  userKey: username
  passwordKey: password
  databaseKey: database
replicaCount: 2
terminationGracePeriodSeconds: 45
service:
  port: 5002
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  fsGroup: 10001
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 1
    successThreshold: 1
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: order
          topologyKey: "kubernetes.io/hostname"
monitoring:
  enabled: true
  releaseLabel: kube-prometheus-stack
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
