apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
data:
  incident-erros-logs-traces.json: |
{{ .Files.Get "dashboards/incident-erros-logs-traces.json" | indent 4 }}
  prometheus-metrics-dashboard.json: |
{{ .Files.Get "dashboards/prometheus-metrics-dashboard.json" | indent 4 }}
  trace-log-correlation-dashboard.json: |
{{ .Files.Get "dashboards/trace-log-correlation-dashboard.json" | indent 4 }}
  prometheus-cluster-dashboard.json: |
{{ .Files.Get "dashboards/prometheus-cluster-dashboard.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: {{ .Release.Namespace }}
data:
  dashboards.yaml: |
{{ .Files.Get "dashboards.yaml" | indent 4 }}
