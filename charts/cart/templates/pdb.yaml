{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart
  namespace: {{ .Release.Namespace }}
  labels:
    app: cart
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: cart
{{- end }}
