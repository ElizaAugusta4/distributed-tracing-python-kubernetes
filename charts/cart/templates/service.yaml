apiVersion: v1
kind: Service
metadata:
  name: cart
  labels:
    app: cart
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: cart
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
