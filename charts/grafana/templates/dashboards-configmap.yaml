apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
data:
  overview-dashboard.json: |
{{ .Files.Get "dashboards/overview-dashboard.json" | indent 4 }}
  latency-errors-dashboard.json: |
{{ .Files.Get "dashboards/latency-errors-dashboard.json" | indent 4 }}
  trace-log-correlation-dashboard.json: |
{{ .Files.Get "dashboards/trace-log-correlation-dashboard.json" | indent 4 }}
  outliers-dashboard.json: |
{{ .Files.Get "dashboards/outliers-dashboard.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: {{ .Release.Namespace }}
data:
  dashboards.yaml: |
{{ .Files.Get "dashboards.yaml" | indent 4 }}
