image:
  repository: ghcr.io/elizaaugusta4/distributed-tracing-python-kubernetes/catalog
  tag: f03f0aa0eb724aa2f5e03f12532af2414896b27b
  pullPolicy: IfNotPresent
replicaCount: 2
terminationGracePeriodSeconds: 45
service:
  port: 5000
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  fsGroup: 10001
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 1
    successThreshold: 1
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: catalog
          topologyKey: "kubernetes.io/hostname"
monitoring:
  enabled: true
  releaseLabel: kube-prometheus-stack
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
