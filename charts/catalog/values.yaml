image:
  repository: ghcr.io/elizaaugusta4/distributed-tracing-python-kubernetes/catalog
  tag: 43df755d6f9ef352fb52cf27040ddd8ee63e50c9
  pullPolicy: IfNotPresent
replicaCount: 2
terminationGracePeriodSeconds: 45
service:
  port: 5000
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  fsGroup: 10001
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 1
    successThreshold: 1
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: catalog
          topologyKey: "kubernetes.io/hostname"
monitoring:
  enabled: true
  releaseLabel: kube-prometheus-stack
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

# Optional: enables dependency-aware readiness checks in /readyz.
# Format: comma-separated URLs to check via GET.
# Example: "http://cart:5001/healthz,http://order:5002/healthz"
dependencyCheckUrls: ""

# Shared outbound HTTP client defaults (services/common/http_client.py)
httpClient:
  connectTimeout: "0.5"
  readTimeout: "2.0"
  retryTotal: "2"
  retryBackoff: "0.2"
