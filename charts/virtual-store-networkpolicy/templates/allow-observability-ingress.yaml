{{- if and .Values.enabled .Values.allowObservabilityIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: virtual-store-allow-observability-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - cart
          - catalog
          - order
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.allowObservabilityIngress.namespace | quote }}
      ports:
{{- range .Values.allowObservabilityIngress.ports }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- end }}
