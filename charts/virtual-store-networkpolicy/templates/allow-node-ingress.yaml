{{- if and .Values.enabled .Values.allowNodeIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: virtual-store-allow-node-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range .Values.allowNodeIngress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
{{- range .Values.allowNodeIngress.ports }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- end }}
