apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: virtual-store-slos
  labels:
    release: {{ .Values.releaseLabel | quote }}
spec:
  groups:
    - name: virtual-store.slo-burnrate
      rules:
{{- range $svc := .Values.services }}
        - alert: SLOBurnRateErrorPage
          expr: |
            (
              (
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }},status_code=~"5.."}[{{ $.Values.slo.burnRate.page.shortWindow }}]))
                /
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.shortWindow }}]))
              ) > ({{ $.Values.slo.burnRate.page.shortFactor }} * (1 - {{ $.Values.slo.errorRate.objective }}))
            )
            and
            (
              (
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }},status_code=~"5.."}[{{ $.Values.slo.burnRate.page.longWindow }}]))
                /
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.longWindow }}]))
              ) > ({{ $.Values.slo.burnRate.page.longFactor }} * (1 - {{ $.Values.slo.errorRate.objective }}))
            )
            and
            (sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.longWindow }}])) > 0)
          for: {{ $.Values.slo.burnRate.page.for | quote }}
          labels:
            severity: page
            service: {{ $svc.name | quote }}
            slo: error-rate
          annotations:
            summary: "High error-budget burn (page)"
            description: "{{ $svc.name }} is burning error budget too fast ({{ $.Values.slo.errorRate.objective }} objective)."

        - alert: SLOBurnRateErrorTicket
          expr: |
            (
              (
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }},status_code=~"5.."}[{{ $.Values.slo.burnRate.ticket.shortWindow }}]))
                /
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.shortWindow }}]))
              ) > ({{ $.Values.slo.burnRate.ticket.shortFactor }} * (1 - {{ $.Values.slo.errorRate.objective }}))
            )
            and
            (
              (
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }},status_code=~"5.."}[{{ $.Values.slo.burnRate.ticket.longWindow }}]))
                /
                sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.longWindow }}]))
              ) > ({{ $.Values.slo.burnRate.ticket.longFactor }} * (1 - {{ $.Values.slo.errorRate.objective }}))
            )
            and
            (sum(rate(http_server_requests_total{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.longWindow }}])) > 0)
          for: {{ $.Values.slo.burnRate.ticket.for | quote }}
          labels:
            severity: ticket
            service: {{ $svc.name | quote }}
            slo: error-rate
          annotations:
            summary: "High error-budget burn (ticket)"
            description: "{{ $svc.name }} sustained error-budget burn ({{ $.Values.slo.errorRate.objective }} objective)."

        - alert: SLOBurnRateLatencyPage
          expr: |
            (
              (
                1 - (
                  sum(rate(http_server_request_duration_seconds_bucket{service={{ $svc.name | quote }},le={{ $.Values.slo.latency.thresholdSeconds | quote }} }[{{ $.Values.slo.burnRate.page.shortWindow }}]))
                  /
                  sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.shortWindow }}]))
                )
              ) > ({{ $.Values.slo.burnRate.page.shortFactor }} * (1 - {{ $.Values.slo.latency.objective }}))
            )
            and
            (
              (
                1 - (
                  sum(rate(http_server_request_duration_seconds_bucket{service={{ $svc.name | quote }},le={{ $.Values.slo.latency.thresholdSeconds | quote }} }[{{ $.Values.slo.burnRate.page.longWindow }}]))
                  /
                  sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.longWindow }}]))
                )
              ) > ({{ $.Values.slo.burnRate.page.longFactor }} * (1 - {{ $.Values.slo.latency.objective }}))
            )
            and
            (sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.page.longWindow }}])) > 0)
          for: {{ $.Values.slo.burnRate.page.for | quote }}
          labels:
            severity: page
            service: {{ $svc.name | quote }}
            slo: latency
          annotations:
            summary: "High latency-budget burn (page)"
            description: "{{ $svc.name }} is burning latency budget too fast ({{ $.Values.slo.latency.objective }} under {{ $.Values.slo.latency.thresholdSeconds }}s)."

        - alert: SLOBurnRateLatencyTicket
          expr: |
            (
              (
                1 - (
                  sum(rate(http_server_request_duration_seconds_bucket{service={{ $svc.name | quote }},le={{ $.Values.slo.latency.thresholdSeconds | quote }} }[{{ $.Values.slo.burnRate.ticket.shortWindow }}]))
                  /
                  sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.shortWindow }}]))
                )
              ) > ({{ $.Values.slo.burnRate.ticket.shortFactor }} * (1 - {{ $.Values.slo.latency.objective }}))
            )
            and
            (
              (
                1 - (
                  sum(rate(http_server_request_duration_seconds_bucket{service={{ $svc.name | quote }},le={{ $.Values.slo.latency.thresholdSeconds | quote }} }[{{ $.Values.slo.burnRate.ticket.longWindow }}]))
                  /
                  sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.longWindow }}]))
                )
              ) > ({{ $.Values.slo.burnRate.ticket.longFactor }} * (1 - {{ $.Values.slo.latency.objective }}))
            )
            and
            (sum(rate(http_server_request_duration_seconds_count{service={{ $svc.name | quote }}}[{{ $.Values.slo.burnRate.ticket.longWindow }}])) > 0)
          for: {{ $.Values.slo.burnRate.ticket.for | quote }}
          labels:
            severity: ticket
            service: {{ $svc.name | quote }}
            slo: latency
          annotations:
            summary: "High latency-budget burn (ticket)"
            description: "{{ $svc.name }} sustained latency-budget burn ({{ $.Values.slo.latency.objective }} under {{ $.Values.slo.latency.thresholdSeconds }}s)."
{{- end }}

    - name: virtual-store.operational
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{namespace={{ .Values.operational.namespace | quote }}, reason="CrashLoopBackOff"}
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod em CrashLoopBackOff"
            description: "Pod/container está em CrashLoopBackOff no namespace {{ .Values.operational.namespace }}."

        - alert: KubeContainerHighRestartRate
          expr: |
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total{namespace={{ .Values.operational.namespace | quote }}}[10m])
            ) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Muitos restarts de container"
            description: "Container reiniciou mais de 3x em 10m no namespace {{ .Values.operational.namespace }}."

        - alert: KubePodPending
          expr: |
            max by (namespace, pod) (
              kube_pod_status_phase{namespace={{ .Values.operational.namespace | quote }}, phase="Pending"}
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod em Pending"
            description: "Pod está Pending por mais de 10m no namespace {{ .Values.operational.namespace }}."

        - alert: KubeHpaMaxedOut
          expr: |
            kube_hpa_status_desired_replicas{namespace={{ .Values.operational.namespace | quote }}}
            ==
            kube_hpa_spec_max_replicas{namespace={{ .Values.operational.namespace | quote }}}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA no máximo"
            description: "HPA desejando o número máximo de réplicas por 15m no namespace {{ .Values.operational.namespace }}."
