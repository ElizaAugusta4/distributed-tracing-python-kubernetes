name: ci

on:
  push:
  pull_request:

jobs:
  helm-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint and template charts
        shell: bash
        run: |
          set -euo pipefail

          charts=(cart catalog order loki promtail tempo postgres)

          for c in "${charts[@]}"; do
            echo "::group::helm lint charts/$c"
            helm lint "charts/$c"
            echo "::endgroup::"

            echo "::group::helm template charts/$c"
            helm template "ci-$c" "charts/$c" >/dev/null
            echo "::endgroup::"
          done
