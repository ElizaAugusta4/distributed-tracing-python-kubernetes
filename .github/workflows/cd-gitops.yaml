name: cd-gitops

on:
  push:
    branches: [ main ]
    paths:
      - "services/**"
      - ".github/workflows/cd-gitops.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-gitops-main
  cancel-in-progress: false

jobs:
  build-push-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image namespace
        shell: bash
        run: |
          set -euo pipefail
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/bake-action@v5
        with:
          push: true
          files: |
            ./services/docker-bake.hcl
        env:
          OWNER_LC: ${{ env.OWNER_LC }}
          GIT_SHA: ${{ github.sha }}

      - name: Trivy scan images (HIGH,CRITICAL)
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_IMAGE="aquasec/trivy:0.50.1"
          CACHE_DIR="${GITHUB_WORKSPACE}/.trivycache"
          mkdir -p "$CACHE_DIR"

          images=(
            "ghcr.io/${OWNER_LC}/distributed-tracing-python-kubernetes/catalog:${GITHUB_SHA}"
            "ghcr.io/${OWNER_LC}/distributed-tracing-python-kubernetes/cart:${GITHUB_SHA}"
            "ghcr.io/${OWNER_LC}/distributed-tracing-python-kubernetes/order:${GITHUB_SHA}"
          )

          for img in "${images[@]}"; do
            echo "::group::Scan $img"
            docker run --rm \
              -v "${CACHE_DIR}:/root/.cache/" \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "$img"
            echo "::endgroup::"
          done

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_IMAGE="aquasec/trivy:0.50.1"
          CACHE_DIR="${GITHUB_WORKSPACE}/.trivycache"
          mkdir -p "$CACHE_DIR"

          images=(
            "catalog"
            "cart"
            "order"
          )

          for name in "${images[@]}"; do
            img="ghcr.io/${OWNER_LC}/distributed-tracing-python-kubernetes/${name}:${GITHUB_SHA}"
            out="sbom-${name}.cdx.json"
            echo "::group::SBOM $img"
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workdir" \
              -v "${CACHE_DIR}:/root/.cache/" \
              -w /workdir \
              "$TRIVY_IMAGE" image \
              --format cyclonedx \
              --output "$out" \
              "$img"
            echo "::endgroup::"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-images-cyclonedx
          path: |
            sbom-catalog.cdx.json
            sbom-cart.cdx.json
            sbom-order.cdx.json

      - name: Update Helm values (image repo+tag)
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: |
            yq e -i '.image.repository = "ghcr.io/${{ env.OWNER_LC }}/distributed-tracing-python-kubernetes/catalog" | .image.tag = "${{ github.sha }}"' charts/catalog/values.yaml
            yq e -i '.image.repository = "ghcr.io/${{ env.OWNER_LC }}/distributed-tracing-python-kubernetes/cart" | .image.tag = "${{ github.sha }}"' charts/cart/values.yaml
            yq e -i '.image.repository = "ghcr.io/${{ env.OWNER_LC }}/distributed-tracing-python-kubernetes/order" | .image.tag = "${{ github.sha }}"' charts/order/values.yaml

            yq e -i '.appVersion = "${{ github.sha }}"' charts/catalog/Chart.yaml
            yq e -i '.appVersion = "${{ github.sha }}"' charts/cart/Chart.yaml
            yq e -i '.appVersion = "${{ github.sha }}"' charts/order/Chart.yaml

      - name: Commit GitOps change
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/catalog/values.yaml charts/cart/values.yaml charts/order/values.yaml \
                  charts/catalog/Chart.yaml charts/cart/Chart.yaml charts/order/Chart.yaml

          git commit -m "(gitops): deploy $GITHUB_SHA"
          git push
