apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/distributed-tracing-python-kubernetes
    targetRevision: HEAD
    path: charts/order
  destination:
    server: https://kubernetes.default.svc
    namespace: virtual-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
